services:
  tradein:
    image: ghcr.io/ialaboratorio/tradein:latest
    build: .
    container_name: tradein
    env_file:
      - .env
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND_IP:-0.0.0.0}:8002:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
